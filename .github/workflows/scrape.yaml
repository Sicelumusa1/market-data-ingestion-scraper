name: Market Data Scraper

on:
  schedule:
    - cron: '0 10,11,12,13 * * 1-6'
  workflow_dispatch:

env:
  TARGET_URL: ${{ secrets.TARGET_URL }}
  GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: uv sync
    
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    
    - name: Create configuration
      run: |
        cat > .env << EOF
        TARGET_URL=${{ secrets.TARGET_URL }}
        GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }}
        GCP_UPLOAD_ENABLED=true
        HEADLESS_MODE=true
        SELENIUM_TIMEOUT=30
        PAGE_LOAD_DELAY=1.5
        EOF
    
    - name: Check date and scrape if new
      run: |
        # Don't fail if date checker returns 1 (new date)
        set +e
        uv run python github_date_checker.py
        exit_code=$?
        set -e
        
        echo "Date checker exit code: $exit_code"
        
        # FORCE KILL ALL Chrome processes and clean up
        echo "Cleaning up Chrome processes..."
        pkill -9 -f "chrome" || true
        pkill -9 -f "chromedriver" || true
        pkill -9 -f "Google Chrome" || true
        pkill -9 -f "chromium" || true
        
        # Clean up Chrome user data directories
        rm -rf /tmp/.com.google.Chrome* || true
        rm -rf /tmp/.org.chromium* || true
        rm -rf ~/.config/google-chrome || true
        
        # Wait for cleanup
        sleep 3
        
        if [ $exit_code -eq 1 ]; then
          echo "New date found - running scraper"
          uv run python main.py
        elif [ $exit_code -eq 0 ]; then
          echo "Date unchanged - skipping scrape"
        else
          echo "Error: Date checker failed with code $exit_code"
          exit $exit_code
        fi
    
    - name: Final Chrome cleanup
      if: always()
      run: |
        echo "Running final Chrome cleanup..."
        pkill -9 -f "chrome" || true
        pkill -9 -f "chromedriver" || true
        pkill -9 -f "Google Chrome" || true
        rm -rf /tmp/.com.google.Chrome* || true
    
    - name: Commit and push generated files
      if: success()
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add generated files
        git add dates.txt date_check_result.json scraper.log data/ || echo "No new files to add"
        
        # Check if there are changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          # Create commit
          timestamp=$(date +'%Y-%m-%d %H:%M:%S')
          git commit -m "Auto-scrape: $timestamp"
          
          # Push changes
          git push
          echo "Changes committed and pushed"
        fi